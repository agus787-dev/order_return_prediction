name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths: # faqat deployment'ga tegishli o'zgarishlarda
      - "app/**"
      - "deep_learning/src/**"
      - "deep_learning/models/**"
      - "deep_learning/__init__.py"
      - "Dockerfile"
      - "requirements.txt"
      - "deploy/**"
  workflow_dispatch: # qo'lda ishga tushirish tugmasi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # model fayllari haqiqiy holda yuklansin

      - name: Prepare Space files
        run: |
          mkdir -p space/deep_learning
          cp -r app space/app
          cp deep_learning/__init__.py space/deep_learning/
          cp -r deep_learning/src space/deep_learning/src
          cp -r deep_learning/models space/deep_learning/models
          cp Dockerfile requirements.txt space/
          cp deploy/HF_README.md space/README.md
          find space -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd space
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "*.pth" "*.joblib"
          git add .
          git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push --force "https://agus-dev:${HF_TOKEN}@huggingface.co/spaces/agus-dev/order-return" main
